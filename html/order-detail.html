<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單詳情</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="開啟或關閉選單">
        <div id="aside-container"></div>
        <label for="nav-toggle" class="overlay" aria-hidden="true"></label>
        <div class="main">
            <header class="topbar">
                <button type="button" id="sidebar-toggle" class="icon-btn menu-btn" aria-label="收合側邊欄" aria-expanded="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                </button>
                <a class="topbar__brand" href="index.html">LOGO</a>
                <form class="search" role="search" action="#">
                    <input type="search" name="q" placeholder="搜尋商品" aria-label="搜尋商品">
                </form>
                <div class="topbar__actions">
                    <a class="icon-btn cart" href="#cart" aria-label="購物車，0 件商品">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6"/>
                            <circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>
                        </svg>
                        <span class="cart__count" hidden>0</span>
                    </a>
                    <div class="topbar__user" id="auth-user" hidden>
                        <span class="avatar" aria-hidden="true">👤</span>
                        <span class="user-name" id="user-name"></span>
                    </div>
                    <button class="topbar__auth" id="auth-open-button" type="button">登入／註冊</button>
                    <button class="topbar__auth topbar__auth--button" id="logout-button" type="button" hidden>登出</button>
                </div>
            </header>
            <dialog class="auth-dialog" id="auth-dialog" aria-labelledby="auth-title">
                <form class="auth-form" id="auth-form">
                    <div class="auth-dialog__header">
                        <h2 id="auth-title">登入</h2>
                        <button class="auth-dialog__close" id="auth-close-button" type="button" aria-label="關閉">×</button>
                    </div>
                    <label class="auth-field" id="auth-username-field" hidden>
                        使用者名稱
                        <input id="auth-username" name="username" type="text" autocomplete="username" minlength="2" maxlength="30">
                    </label>
                    <label class="auth-field">
                        <span id="auth-identifier-label">使用者名稱或 Mail</span>
                        <input id="auth-identifier" name="identifier" type="text" autocomplete="username" placeholder="請輸入使用者名稱或 Mail" required maxlength="254">
                    </label>
                    <label class="auth-field">
                        密碼
                        <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
                    </label>
                    <p class="auth-status" id="auth-status" role="status" aria-live="polite" hidden></p>
                    <button class="topbar__auth auth-submit" id="auth-submit-button" type="submit">登入</button>
                    <button class="auth-google-button" id="auth-google-button" type="button">使用 Google 登入</button>
                    <button class="auth-mode-toggle" id="auth-mode-toggle" type="button">還沒有帳號？註冊</button>
                    <p class="auth-demo-note">註冊僅檢查 Email 格式，不會寄送驗證信。</p>
                </form>
            </dialog>

            <main class="content order-detail-page">
                <a class="order-detail__back" href="order.html">← 返回我的訂單</a>
                <div id="order-detail-content" aria-live="polite">
                    <p role="status">正在載入訂單…</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/aside.js"></script>
    <script src="js/cart-state.js"></script>
    <script src="js/auth.js"></script>
    <script type="module" src="js/order-detail.js"></script>
</body>

</html>
