<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的訂單</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="開啟或關閉選單">
        <div id="aside-container"></div>
        <label for="nav-toggle" class="overlay" aria-hidden="true"></label>
        <div class="main">
            <header class="topbar">
                <button type="button" id="sidebar-toggle" class="icon-btn menu-btn" aria-label="收合側邊欄" aria-expanded="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                </button>
                <a class="topbar__brand" href="index.html">LOGO</a>
                <form class="search" role="search" action="#">
                    <input type="search" name="q" placeholder="搜尋商品" aria-label="搜尋商品">
                </form>
                <div class="topbar__actions">
                    <a class="icon-btn cart" href="#cart" aria-label="購物車，0 件商品">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6"/>
                            <circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>
                        </svg>
                        <span class="cart__count" hidden>0</span>
                    </a>
                    <div class="topbar__user" id="auth-user" hidden>
                        <span class="avatar" aria-hidden="true">👤</span>
                        <span class="user-name" id="user-name"></span>
                    </div>
                    <button class="topbar__auth" id="auth-open-button" type="button">登入／註冊</button>
                    <button class="topbar__auth topbar__auth--button" id="logout-button" type="button" hidden>登出</button>
                </div>
            </header>
            <dialog class="auth-dialog" id="auth-dialog" aria-labelledby="auth-title">
                <form class="auth-form" id="auth-form">
                    <div class="auth-dialog__header">
                        <h2 id="auth-title">登入</h2>
                        <button class="auth-dialog__close" id="auth-close-button" type="button" aria-label="關閉">×</button>
                    </div>
                    <label class="auth-field" id="auth-username-field" hidden>
                        使用者名稱
                        <input id="auth-username" name="username" type="text" autocomplete="username" minlength="2" maxlength="30">
                    </label>
                    <label class="auth-field">
                        <span id="auth-identifier-label">使用者名稱或 Mail</span>
                        <input id="auth-identifier" name="identifier" type="text" autocomplete="username" placeholder="請輸入使用者名稱或 Mail" required maxlength="254">
                    </label>
                    <label class="auth-field">
                        密碼
                        <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
                    </label>
                    <p class="auth-status" id="auth-status" role="status" aria-live="polite" hidden></p>
                    <button class="topbar__auth auth-submit" id="auth-submit-button" type="submit">登入</button>
                    <button class="auth-google-button" id="auth-google-button" type="button">使用 Google 登入</button>
                    <button class="auth-mode-toggle" id="auth-mode-toggle" type="button">還沒有帳號？註冊</button>
                    <p class="auth-demo-note">註冊僅檢查 Email 格式，不會寄送驗證信。</p>
                </form>
            </dialog>

            <main class="content order-page">
                <div class="page-head">
                    <h1 class="page-title">我的訂單</h1>
                    <p class="result-count" aria-live="polite">共 <strong data-order-total>0</strong> 筆訂單</p>
                </div>

                <button class="order-reminder" type="button" hidden>
                    <span class="order-reminder__text"></span>
                    <span class="order-reminder__action">只看這些</span>
                </button>

                <nav class="order-filter" aria-label="依訂單狀態篩選">
                    <ul class="chips">
                        <li><button type="button" class="chip is-active" data-filter="all" aria-pressed="true">全部 <span data-filter-count></span></button></li>
                        <li><button type="button" class="chip" data-filter="demo" aria-pressed="false">示範訂單 <span data-filter-count></span></button></li>
                        <li><button type="button" class="chip" data-filter="unpaid" aria-pressed="false">待付款 <span data-filter-count></span></button></li>
                        <li><button type="button" class="chip" data-filter="waiting" aria-pressed="false">待成團 <span data-filter-count></span></button></li>
                        <li><button type="button" class="chip" data-filter="preparing" aria-pressed="false">準備出貨 <span data-filter-count></span></button></li>
                        <li><button type="button" class="chip" data-filter="shipped" aria-pressed="false">已出貨 <span data-filter-count></span></button></li>
                        <li><button type="button" class="chip" data-filter="done" aria-pressed="false">已完成 <span data-filter-count></span></button></li>
                        <li><button type="button" class="chip" data-filter="cancelled" aria-pressed="false">已取消／已退款 <span data-filter-count></span></button></li>
                    </ul>
                </nav>

                <section class="order-empty" hidden aria-live="polite">
                    <p></p>
                    <a class="btn" href="commodity.html">去看開團中的商品</a>
                </section>

                <ul class="order-list" id="order-list" aria-label="訂單清單"></ul>
                <button class="order-load-more" type="button" hidden>載入更多</button>

                <details class="order-ended" id="ended-orders" hidden>
                    <summary>
                        <span>已結束的訂單</span>
                        <span class="order-ended__count"></span>
                    </summary>
                    <ul class="order-list" id="ended-order-list" aria-label="已取消或已退款的訂單"></ul>
                </details>
            </main>
        </div>
    </div>

    <script src="js/aside.js"></script>
    <script src="js/cart-state.js"></script>
    <script src="js/auth.js"></script>
    <script type="module" src="js/order.js"></script>
</body>

</html>
